<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gmail (MailBrief fixture)</title>
  </head>
  <body style="font-family: Arial, sans-serif; padding: 24px">
    <h1>Inbox — fixture</h1>
    <div data-message-id="thread-1" style="border: 1px solid #ccc; padding: 12px; border-radius: 8px">
      <div>From: alice@example.com</div>
      <div>Subject: Q3 report and notes</div>
      <div role="list" aria-label="Attachments" style="margin-top: 10px">
        <div role="listitem" class="aQH" style="border-top: 1px solid #eee; padding: 8px 0">
          <span class="aZh" title="q3-report.pdf">q3-report.pdf</span>
          <div role="button" aria-label="Download q3-report.pdf" tabindex="0" style="display: inline-block; margin-left: 8px; cursor: pointer">Download</div>
          <a href="/attachments/q3-report.pdf" aria-label="Download q3-report.pdf" style="margin-left: 8px">download link</a>
        </div>
        <div role="listitem" class="aQH" style="border-top: 1px solid #eee; padding: 8px 0">
          <span class="aZh" title="scanned.pdf">scanned.pdf</span>
          <div role="button" aria-label="Download scanned.pdf" tabindex="0" style="display: inline-block; margin-left: 8px; cursor: pointer">Download</div>
          <a href="/attachments/scanned.pdf" aria-label="Download scanned.pdf" style="margin-left: 8px">download link</a>
        </div>
        <div role="listitem" class="aQH" style="border-top: 1px solid #eee; padding: 8px 0">
          <span class="aZh" title="no-link.pdf">no-link.pdf</span>
          <div role="button" aria-label="Download no-link.pdf" tabindex="0" style="display: inline-block; margin-left: 8px; cursor: pointer">Download</div>
        </div>
        <div role="listitem" class="aQH" style="border-top: 1px solid #eee; padding: 8px 0">
          <span class="aZh" title="large.txt">large.txt</span>
          <div role="button" aria-label="Download large.txt" tabindex="0" style="display: inline-block; margin-left: 8px; cursor: pointer">Download</div>
          <a href="/attachments/large.txt" aria-label="Download large.txt" style="margin-left: 8px">download link</a>
        </div>
      </div>
    </div>
  </body>
</html>
