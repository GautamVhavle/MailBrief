<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Outlook Web (MailBrief fixture)</title>
  </head>
  <body style="font-family: Arial, sans-serif; padding: 24px">
    <h1>Outlook — fixture</h1>
    <div data-convid="conv-1" style="border: 1px solid #ccc; padding: 12px; border-radius: 8px">
      <div>From: bob@example.com</div>
      <div>Subject: Contract for review</div>
      <div role="list" aria-label="Attachments" style="margin-top: 10px">
        <div role="listitem" aria-label="Attachment contract.docx" style="border-top: 1px solid #eee; padding: 8px 0">
          <span class="fileName" title="contract.docx">contract.docx</span>
          <button role="button" aria-label="Download contract.docx" style="margin-left: 8px; cursor: pointer">Download</button>
          <a href="/attachments/contract.docx" style="margin-left: 8px">download link</a>
        </div>
        <div role="listitem" aria-label="Attachment notes.txt" style="border-top: 1px solid #eee; padding: 8px 0">
          <span class="fileName" title="notes.txt">notes.txt</span>
          <button role="button" aria-label="Download notes.txt" style="margin-left: 8px; cursor: pointer">Download</button>
          <a href="/attachments/notes.txt" style="margin-left: 8px">download link</a>
        </div>
      </div>
    </div>
  </body>
</html>
